services:
  - type: web
    name: aiexamplatform-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: aiexamplatform-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aiexamplatform-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        value: admin@aiexamplatform.com
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app
      - key: FRONTEND_URL
        value: https://your-app.vercel.app

databases:
  - name: aiexamplatform-db
    plan: basic-256mb
